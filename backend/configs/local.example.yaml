# 本地开发配置。复制为 local.yaml 后可改，local.yaml 已 gitignore。
environment: development

server:
  grpc_address: 127.0.0.1:50091
  http_address: 127.0.0.1:8291
  shutdown_timeout: 15s
  health_timeout: 2s

database:
  host: 127.0.0.1
  port: 5432
  name: devmaster_dev
  user: devmaster_app
  # 本地专用口令，生产从密钥管理注入。
  password: devmaster_dev_only
  ssl_mode: disable
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m

logging:
  level: info
  format: text

# 本地关闭身份：拦截器注入 demo 主体，角色给全。
# production 下 enabled=false 会被配置校验直接拒绝启动。
auth:
  enabled: false
  issuer: http://127.0.0.1:8180/realms/devmaster
  audience: devmaster-service
  demo_subject: local-dev
  demo_organization_id: 00000000-0000-0000-0000-000000000001
  demo_roles:
    - DEV_ADMIN
    - DEV_LEAD
    - DEV_MEMBER
    - DEV_VIEWER
    - RELEASE_APPROVER

nats:
  url: nats://127.0.0.1:4222
  stream: DEVMASTER_EVENTS
  subject_prefix: dev
  # 流由 devmaster 自己拥有：relay 会在缺失时创建。
  read_only: false

temporal:
  host_port: 127.0.0.1:7233
  namespace: devmaster
  task_queue: devmaster-maintenance

outbox:
  batch_size: 100
  poll_interval: 1s
  max_attempts: 10
  base_backoff: 2s
  max_backoff: 5m

approver:
  # 本地 approver API（HEADER 模式）；生产走 OIDC + 网关。
  base_url: http://127.0.0.1:18090
  tenant_id: default
  service_user: devmaster-service
  approver_user: release-approver
  process_key: devmaster-release-approval
  poll_interval: 5s
  poll_timeout: 30m

gitea:
  base_url: http://127.0.0.1:3123
  # 令牌从环境变量 DEVMASTER_GITEA_TOKEN 注入，不写进仓库。
  token: ""
  owner: meshadmin
  repo: hosp
  # 与 Gitea webhook 配置里的 secret 一致；失败返回 401。
  webhook_secret: devmaster-dev-secret
  organization_id: 00000000-0000-0000-0000-000000000001


# artifact 证据存证（发布链的 SealEvidence 活动）。
# enabled=false 时发布链跳过存证、evidence_ref 退化为发布说明引用；生产
# 环境启动即拒绝这种降级（config.Validate）。
artifact:
  enabled: true
  address: 127.0.0.1:50071
  # 令牌走 Keycloak client_credentials；只配 issuer 时自动发现 token 端点。
  issuer: http://127.0.0.1:8180/realms/artifact
  client_id: content-worker
  # 口令从环境变量 DEVMASTER_ARTIFACT_CLIENT_SECRET 注入，不写进仓库。
  client_secret: ""
  tenant_id: 00000000-0000-0000-0000-000000000001
  organization_id: 00000000-0000-0000-0000-000000000001
  namespace: devmaster
  test_report_type: devmaster.test-report
  release_notes_type: devmaster.release-notes
  timeout: 30s
  tls: false

# 主体目录（subject-registry）：把通知收件人从团队箱改为具体人。
# enabled=false 时通知发团队收件箱——这是显式降级，不是失败：
# 主体目录只影响「发给谁」，不影响「发不发」，所以生产不强制开启。
subject_registry:
  enabled: true
  address: 127.0.0.1:50095
  # 与服务端 SUBJECT_SERVICE_TOKEN 一致；从环境变量
  # DEVMASTER_SUBJECT_REGISTRY_TOKEN 注入，不写进仓库。
  service_token: ""
  timeout: 5s
